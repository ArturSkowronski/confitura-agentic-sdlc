# Konfiguracja kontrolera Argo na warsztat: bez repozytorium artefaktów (wyniki idą na dysk /work),
# logi z podów, mały limit równoległości w namespace (lekcja 9 dokłada semafor WIP).
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  namespace: argo
data:
  namespaceParallelism: "6"
  retentionPolicy: |
    completed: 20
    failed: 10
  # Z przebiegu w hali prosto do jego śladu: spany kroków (serwis fabryka-linia) mają tag fabryka.run.
  links: |
    - name: Ślad w Jaegerze
      scope: workflow
      url: http://localhost:16686/search?service=fabryka-linia&lookback=2d&tags=%7B%22fabryka.run%22%3A%22${metadata.name}%22%7D
  executor: |
    resources:
      requests: {cpu: 10m, memory: 64Mi}
