# Polityka na deklaracje agentów (Kyverno ValidatingPolicy, CEL). Uprawnienia agenta to lista narzędzi,
# a lista narzędzi to manifest, więc pilnuje jej admission controller, nie review.
# Reguła 1 (gotowa): każdy agent fabryki ma etykietę fabryka.dev/rola.
# Reguła 2 (rozwiązanie lekcji 9): wykonawca ma wyłącznie narzędzia serwera `warsztat` i nie woła innych agentów.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: fabryka-agent-narzedzia
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: fabryka}
    resourceRules:
      - apiGroups: ["kagent.dev"]
        apiVersions: ["v1alpha2"]
        operations: [CREATE, UPDATE]
        resources: ["agents"]
  validations:
    - expression: >-
        has(object.metadata.labels) && 'fabryka.dev/rola' in object.metadata.labels
      message: "Agent fabryki musi mieć etykietę fabryka.dev/rola (przyjecie | wykonawca | recenzent | probny)."
    - expression: >-
        !(has(object.metadata.labels) && object.metadata.labels[?'fabryka.dev/rola'].orValue('') == 'wykonawca') ||
        object.spec.?declarative.?tools.orValue([]).all(t, t.type == 'McpServer' && t.?mcpServer.?name.orValue('') == 'warsztat')
      message: "Wykonawca ma tylko narzędzia serwera warsztat. Inne narzędzia i agenci jako narzędzia są zabronione."
