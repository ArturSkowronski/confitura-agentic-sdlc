# Warsztat agenta: serwer MCP (streamable HTTP) na wspólnym dysku. CRD MCPServer pochodzi z kmcp (część kagent);
# kontroler robi Deployment i Service, a kagent sam odkrywa narzędzia (kubectl get mcpserver -n fabryka).
#
# Granice agenta są tutaj, w konfiguracji serwera, a nie w prompcie:
#   PROTECTED_PATHS  zapis odrzucony
#   HIDDEN_PATHS     odczyt odrzucony i zapisany jako holdout.peek
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: warsztat
  namespace: fabryka
spec:
  transportType: http
  httpTransport:
    targetPort: 3000
    path: /mcp
  timeout: 10m
  deployment:
    image: fabryka-warsztat:lekcja
    imagePullPolicy: IfNotPresent
    port: 3000
    env:
      WORK_DIR: /work/repo
      EVENTS_FILE: /work/events.jsonl
      # Rozwiązanie lekcji 2: bramki, linia i wyrocznia są poza zasięgiem zapisu.
      PROTECTED_PATHS: "sdlc platforma system/architecture scenarios"
      # Rozwiązanie lekcji 7: wyrocznia poza zasięgiem odczytu; próba zostaje w śladzie jako holdout.peek.
      HIDDEN_PATHS: "scenarios"
    volumeMounts: [{name: work, mountPath: /work}]
    volumes:
      - name: work
        persistentVolumeClaim: {claimName: warsztat}
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 2Gi}
