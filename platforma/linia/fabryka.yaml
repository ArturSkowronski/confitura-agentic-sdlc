# Linia produkcyjna fabryki (lekcja 10). Jeden przebieg = jedno zlecenie, próby jako rekurencja szablonu `linia`:
#   📥 przyjęcie (spec, routing) → 🤖 wykonawca (kagent przez A2A albo replay) → 📦 zmiana (gałąź + łatka w /work/out)
#   → 🧱 kontrola jakości ‖ 🔎 ryzyko i review → ⚖️ decyzja: lights-out | 👤 człowiek | 🔁 poprawka (próba+1) | 🚨 andon
#   → 🔗 księga (łańcuch hashy, podpis cosign) + 🏭 karta zlecenia
# Uruchomienie: make zlecenie Z=rabat [AGENT=replay]. Graf i logi: hala (Argo UI).
# Finał (warsztat/final-github.md): zrodlo=github. Zlecenie to issue, wynik to PR z księgą i pierwszym review,
# andon to komentarz pod issue. Przebiegi zakłada CronWorkflow fabryka-ciagnie (platforma/github/).
# Ślad: Argo zakłada trace przebiegu, każdy krok dokłada swój span (sdlc/slad.py), agent kagent zagnieżdża się pod krokiem.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fabryka
  namespace: fabryka
spec:
  serviceAccountName: fabryka
  entrypoint: linia
  # Po przebiegu, także po awarii: korzeń śladu, a na GitHubie issue nie może zostać „w toku”.
  onExit: koniec
  # Limit WIP (lekcja 9): fabryka ciągnie, nie pcha. Nadmiarowe zlecenia czekają w kolejce na semaforze.
  synchronization:
    semaphores:
      - configMapKeyRef: {name: fabryka-wip, key: wip}
  arguments:
    parameters:
      - {name: zlecenie, value: rabat}
      - {name: agent, value: kagent}      # kagent | replay
      - {name: proba, value: "1"}
      - {name: modul, value: ""}          # tylko replay: wymuś moduł nagrania (make naiwna)
      - {name: zrodlo, value: plik}       # plik (zlecenia/*.md, wynik w /work/out) | github (issue → PR)
  volumes:
    - name: work
      persistentVolumeClaim: {claimName: warsztat}
    - name: cosign
      secret: {secretName: fabryka-cosign, optional: true}
  templates:
    - name: linia
      inputs:
        parameters: [{name: zlecenie}, {name: agent}, {name: proba}, {name: modul, value: ""}, {name: zrodlo, value: plik}]
      steps:
        - - name: przygotuj
            template: przygotuj
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}, {name: zrodlo, value: "{{inputs.parameters.zrodlo}}"}]}
        - - name: przyjecie
            template: przyjecie
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}, {name: zrodlo, value: "{{inputs.parameters.zrodlo}}"}]}
        - - name: wykonawca
            template: wykonawca
            when: "{{steps.przyjecie.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: agent, value: "{{inputs.parameters.agent}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}, {name: modul, value: "{{inputs.parameters.modul}}"}]}
        - - name: zmiana
            template: zmiana
            when: "{{steps.przyjecie.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: agent, value: "{{inputs.parameters.agent}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}]}
        - - name: kontrola
            template: kontrola
            when: "{{steps.przyjecie.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}]}
          - name: review
            template: review
            when: "{{steps.przyjecie.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}]}
        - - name: decyzja
            template: decyzja
            when: "{{steps.przyjecie.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}]}
        # Na GitHubie człowiekiem jest review PR: linia nie staje, PR czeka bez auto-merge.
        - - name: czlowiek
            template: czlowiek
            when: "{{steps.decyzja.outputs.parameters.decyzja}} == człowiek && {{inputs.parameters.zrodlo}} == plik"
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}]}
        - - name: ksiega
            template: ksiega
            when: "{{steps.przyjecie.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}, {name: decyzja, value: "{{steps.decyzja.outputs.parameters.decyzja}}"}]}
        - - name: github
            template: github
            when: "{{inputs.parameters.zrodlo}} == github && {{steps.przyjecie.outputs.parameters.accepted}} == true && {{steps.decyzja.outputs.parameters.decyzja}} != poprawka"
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}, {name: decyzja, value: "{{steps.decyzja.outputs.parameters.decyzja}}"}]}
        - - name: wynik
            template: wynik
            when: "{{steps.przyjecie.outputs.parameters.accepted}} == true && {{steps.decyzja.outputs.parameters.decyzja}} != poprawka"
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: proba, value: "{{inputs.parameters.proba}}"}, {name: decyzja, value: "{{steps.decyzja.outputs.parameters.decyzja}}"}]}
          # Poprawka = ta sama linia, próba + 1. Rekurencja szablonu zamiast osobnego przebiegu: cała historia w jednym grafie.
          - name: poprawka
            template: linia
            when: "{{steps.decyzja.outputs.parameters.decyzja}} == poprawka"
            arguments: {parameters: [{name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}, {name: agent, value: "{{inputs.parameters.agent}}"}, {name: proba, value: "{{=asInt(inputs.parameters.proba) + 1}}"}, {name: modul, value: "{{inputs.parameters.modul}}"}, {name: zrodlo, value: "{{inputs.parameters.zrodlo}}"}]}

    # Kontrola jakości: deterministyczna, bez modelu, poza zasięgiem agenta. Czerwona bramka nie zatrzymuje
    # pozostałych: fabryka chce pełny obraz, zanim zdecyduje. Mutacje po buildzie (ten sam katalog target/).
    - name: kontrola
      inputs:
        parameters: [{name: zlecenie}, {name: proba}]
      dag:
        tasks:
          - name: build
            template: krok
            continueOn: {failed: true}
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    set +e; (cd system && mvn -B verify > ../.sdlc/mvn.log 2>&1); code=$?; set -e
                    tail -n 30 .sdlc/mvn.log
                    python3 sdlc/gates.py report --log .sdlc/mvn.log --exit-code $code > "$OUT/kontrola-1-build.md"
                    set +e; python3 sdlc/gates.py weakening --base main --head HEAD > "$OUT/kontrola-2-oslabianie.md"; weak=$?; set -e
                    cat "$OUT/kontrola-1-build.md" "$OUT/kontrola-2-oslabianie.md"
                    echo "$code" > "$OUT/kontrola-1-build.exit"; echo "$weak" > "$OUT/kontrola-2-oslabianie.exit"
                    exit $((code + weak))
          - name: sekrety
            template: krok
            continueOn: {failed: true}
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    set +e; gitleaks git --log-opts="main..HEAD" --redact --no-banner --no-color . > .sdlc/gitleaks.log 2>&1; code=$?; set -e
                    cat .sdlc/gitleaks.log
                    if [ $code -eq 0 ]; then printf '### 🔑 Sekrety: ✅ gitleaks nic nie znalazł\n' > "$OUT/kontrola-3-sekrety.md"
                    else printf '### 🔑 Sekrety: ❌ gitleaks znalazł sekret w commitach zmiany\n' > "$OUT/kontrola-3-sekrety.md"; fi
                    echo "$code" > "$OUT/kontrola-3-sekrety.exit"; exit $code
          - name: wyrocznia
            template: krok
            dependencies: [build]
            continueOn: {failed: true}
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    # Scenariusze zawsze z main, nigdy z gałęzi zmiany: agent nie może ich zmienić ani dopisać.
                    rm -rf scenarios && git checkout -q main -- scenarios
                    (cd system && mvn -B -q install -DskipTests > /dev/null 2>&1)
                    title=$(jq -r .title .sdlc/zlecenie.json)
                    set +e; python3 sdlc/scenarios.py run --work-order "$title" > "$OUT/kontrola-5-wyrocznia.md"; code=$?; set -e
                    cat "$OUT/kontrola-5-wyrocznia.md"; cp .sdlc/scenarios.json "$OUT/wyrocznia.json"
                    git checkout -q -- scenarios 2>/dev/null || true
                    echo "$code" > "$OUT/kontrola-5-wyrocznia.exit"; exit $code
          - name: mutacje
            template: krok
            dependencies: [wyrocznia]
            continueOn: {failed: true}
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    set +e; python3 sdlc/mutation.py --base main --head HEAD --threshold "$(jq -r '.gates.mutation_threshold // 60' sdlc/policy.json)" > .sdlc/pit.log 2>&1; code=$?; set -e
                    sed -n '/^### 🧬/,$p' .sdlc/pit.log > "$OUT/kontrola-4-mutacje.md"
                    [ -s "$OUT/kontrola-4-mutacje.md" ] || { tail -n 20 .sdlc/pit.log; printf '### 🧬 Mutacje: ⚠️ PIT nie dał wyniku\n' > "$OUT/kontrola-4-mutacje.md"; }
                    cat "$OUT/kontrola-4-mutacje.md"; echo "$code" > "$OUT/kontrola-4-mutacje.exit"; exit $code

    # Ryzyko liczy kod, nie model (sdlc/risk.py). Od poziomu zależy, czy pytamy recenzenta i czy zmiana czeka na człowieka.
    - name: review
      inputs:
        parameters: [{name: zlecenie}, {name: proba}]
      steps:
        - - name: run
            template: krok
            continueOn: {failed: true}
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    mkdir -p /tmp/outputs; title=$(jq -r .title .sdlc/zlecenie.json)
                    python3 sdlc/risk.py --base main --head HEAD --agent --attempt "$ATTEMPT" --work-order "$title" > "$OUT/review-1-ryzyko.md"
                    cp .sdlc/risk.json "$OUT/ryzyko.json"; cp /tmp/outputs/needs_human "$OUT/needs_human"; cat "$OUT/review-1-ryzyko.md"
                    set +e; python3 sdlc/review.py --base main --head HEAD --fail-on-blocking > /dev/null; code=$?; set -e
                    cp .sdlc/review.md "$OUT/review-2-review.md"; cp .sdlc/review.sarif "$OUT/review.sarif" 2>/dev/null || true
                    cat "$OUT/review-2-review.md"; echo "$code" > "$OUT/review.exit"; exit $code

    - name: decyzja
      inputs:
        parameters: [{name: zlecenie}, {name: proba}]
      outputs:
        parameters:
          - name: decyzja
            valueFrom: {parameter: "{{steps.run.outputs.parameters.decyzja}}"}
      steps:
        - - name: run
            template: krok-decyzja
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    max=$(jq -r '.line.max_attempts' sdlc/policy.json)
                    red=0; for f in "$OUT"/kontrola-*.exit; do [ "$(cat "$f")" = "0" ] || red=1; done
                    review=$(cat "$OUT/review.exit" 2>/dev/null || echo 1); needs_human=$(cat "$OUT/needs_human" 2>/dev/null || echo true)
                    vault=$(jq -r '.vault // "brak"' "$OUT/wyrocznia.json" 2>/dev/null || echo brak)
                    reason=""
                    # Review blokujący eskaluje do człowieka, nie do poprawki: model radzi, człowiek decyduje.
                    # Poprawkę wymuszają tylko bramki deterministyczne (kontrola jakości).
                    [ "$review" = "0" ] || needs_human=true
                    if [ $red = 0 ]; then
                      if [ "$needs_human" = "true" ]; then decyzja="człowiek"; else decyzja="lights-out"; fi
                    elif [ "$vault" = "nie przeszedł" ]; then decyzja="andon"; reason="Sejf nie przeszedł (poprawka pod sejf zamieniłaby go w zbiór treningowy)"
                    elif [ "$ATTEMPT" -ge "$max" ]; then decyzja="andon"; reason="$ATTEMPT próby bez przejścia kontroli jakości"
                    else decyzja="poprawka"; fi
                    echo "Decyzja: $decyzja ${reason:+($reason)}"; echo "$decyzja" > /tmp/outputs/decyzja
                    printf '%s\n' "$decyzja" > "$OUT/decyzja"; [ -z "$reason" ] || printf '%s\n' "$reason" > "$OUT/andon.md"
                    if [ "$decyzja" = "poprawka" ]; then python3 sdlc/factory.py feedback > "$OUT/feedback.md"; echo "--- raport dla agenta ---"; cat "$OUT/feedback.md"; fi

    # Człowiek to węzeł z rolą (lekcja 9): linia staje (suspend), make zatwierdz zapisuje kto i wznawia.
    - name: czlowiek
      inputs:
        parameters: [{name: zlecenie}, {name: proba}]
      steps:
        - - name: czekaj
            template: czekaj
        - - name: zapisz
            template: krok
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    kto="{{steps.czekaj.outputs.parameters.kto}}"
                    printf '### 👤 Akceptacja: ✅ %s\n' "$kto" > "$OUT/czlowiek.md"
                    printf 'human.approved %s\n' "$kto" > "$OUT/czlowiek"; cat "$OUT/czlowiek.md"

    - name: czekaj
      suspend: {}
      outputs:
        parameters:
          - name: kto
            valueFrom: {supplied: {}}

    # Księga: każde zdarzenie próby jako linia z hashem poprzedniej. Budowana deterministycznie z wyników kroków
    # (bramki, wyrocznia, ryzyko, decyzja, człowiek) i ze śladu narzędzi agenta. Podpis kluczem fabryki (cosign, offline).
    - name: ksiega
      inputs:
        parameters: [{name: zlecenie}, {name: proba}, {name: decyzja}]
      steps:
        - - name: run
            template: krok-podpis
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    decyzja="{{inputs.parameters.decyzja}}"; L="--file $OUT/ledger.jsonl"; rm -f "$OUT/ledger.jsonl"
                    python3 sdlc/factory.py line-config > /dev/null
                    python3 sdlc/ledger.py $L append --type line.config --data "$(jq -c . .sdlc/line-config.json)"
                    trace=$(python3 sdlc/slad.py url); [ -z "$trace" ] || python3 sdlc/ledger.py $L append --type trace --data "{\"url\": \"$trace\"}"
                    python3 sdlc/ledger.py $L append --type order.intake --data "$(jq -c '{accepted, problems}' .sdlc/intake.json)"
                    python3 sdlc/ledger.py $L append --type order.routed --data "$(jq -c --argjson a "$ATTEMPT" '{attempt: $a, module, reason, blast_radius, critical_in_radius}' .sdlc/route.json)"
                    python3 sdlc/ledger.py $L append --type agent.prompt --data "{\"agent\": \"$AGENT\", \"sha256\": \"$(sha256sum .sdlc/prompt.md | cut -d' ' -f1)\", \"bytes\": $(wc -c < .sdlc/prompt.md)}"
                    python3 sdlc/ledger.py $L ingest --source warsztat --events "$OUT/narzedzia.jsonl" > /dev/null
                    python3 sdlc/ledger.py $L ingest --source "$AGENT" --events "$OUT/agent-events.jsonl" > /dev/null
                    [ ! -s "$OUT/holdout-peek.jsonl" ] || python3 sdlc/ledger.py $L append --type holdout.peek --data "{\"count\": $(wc -l < "$OUT/holdout-peek.jsonl")}"
                    python3 sdlc/ledger.py $L append --type git.commit --data "{\"sha\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git branch --show-current)\", \"files\": $(git show --name-only --format= HEAD | jq -Rsc 'split("\n") | map(select(length > 0))')}"
                    for f in "$OUT"/kontrola-*.exit; do n=$(basename "$f" .exit); python3 sdlc/ledger.py $L append --type "gate.${n#kontrola-?-}" --data "{\"exit_code\": $(cat "$f")}"; done
                    [ ! -f "$OUT/wyrocznia.json" ] || python3 sdlc/ledger.py $L append --type gate.oracle --data "$(jq -c '{covered, working_failed, vault}' "$OUT/wyrocznia.json")"
                    [ ! -f "$OUT/ryzyko.json" ] || python3 sdlc/ledger.py $L append --type review.risk --data "$(jq -c '{level, score, needs_human, autonomy}' "$OUT/ryzyko.json")"
                    python3 sdlc/ledger.py $L append --type review.result --data "{\"exit_code\": $(cat "$OUT/review.exit" 2>/dev/null || echo 1)}"
                    python3 sdlc/ledger.py $L append --type order.decision --data "$(jq -nc --arg d "$decyzja" --arg r "$(cat "$OUT/andon.md" 2>/dev/null)" --argjson a "$ATTEMPT" '{decision: $d, reason: $r, attempt: $a}')"
                    if [ -f "$OUT/czlowiek" ]; then read -r kind who < "$OUT/czlowiek"; python3 sdlc/ledger.py $L append --type "$kind" --data "$(jq -nc --arg w "${who:-}" '{by: $w}')"; fi
                    final="$decyzja"; [ "$decyzja" != "człowiek" ] || { grep -q human.approved "$OUT/czlowiek" 2>/dev/null && final="człowiek" || final="czeka"; }
                    python3 sdlc/factory.py card --attempt "$ATTEMPT" --decision "$final" > "$OUT/karta.md"
                    python3 sdlc/ledger.py $L append --type order.card --data "$(jq -c . .sdlc/card.json)"
                    python3 sdlc/ledger.py $L verify && python3 sdlc/ledger.py $L summary > "$OUT/ksiega.md"
                    if [ -f /run/secrets/cosign/cosign.key ]; then
                      COSIGN_PASSWORD="" cosign sign-blob --yes --key /run/secrets/cosign/cosign.key --tlog-upload=false --use-signing-config=false \
                        --bundle "$OUT/ledger.sigstore.json" "$OUT/ledger.jsonl" 2>/dev/null && echo "księga podpisana: $OUT/ledger.sigstore.json"
                    else echo "brak klucza cosign (make klucze-cosign): księga bez podpisu"; fi
                    cat "$OUT/karta.md" "$OUT/ksiega.md"

    - name: wynik
      inputs:
        parameters: [{name: zlecenie}, {name: proba}, {name: decyzja}]
      steps:
        - - name: run
            template: krok
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    decyzja="{{inputs.parameters.decyzja}}"
                    for f in "$OUT"/kontrola-*.exit; do c=$(cat "$f"); n=$(basename "$f" .exit); [ "$c" = "0" ] && echo "✅ $n" || echo "❌ $n (exit $c)"; done
                    [ "$(cat "$OUT/review.exit" 2>/dev/null)" = "0" ] && echo "✅ review" || echo "🚫 review: znaleziska blokujące (do decyzji człowieka)"
                    cat "$OUT"/kontrola-*.md "$OUT"/review-*.md "$OUT"/czlowiek.md > "$OUT/raport.md" 2>/dev/null || true
                    case "$decyzja" in
                      lights-out) echo "🌑 Przyjęte bez człowieka (lights-out). Łatka: $OUT/zmiana.patch" ;;
                      człowiek)   [ "$(cat "$OUT/czlowiek" 2>/dev/null)" = "human.approval_missing" ] && echo "👤 Wymaga człowieka, a przebieg nie czekał (lekcja 9)" || echo "👤 Przyjęte przez człowieka" ;;
                      andon)      echo "🚨 Andon: linia zatrzymana. $(cat "$OUT/andon.md" 2>/dev/null). Fabryka nie zgaduje dalej: człowiek decyduje."; exit 1 ;;
                    esac

    - name: krok-decyzja
      inputs:
        parameters: [{name: skrypt}, {name: zlecenie}, {name: agent, value: kagent}, {name: proba, value: "1"}]
      outputs:
        parameters:
          - name: decyzja
            valueFrom: {path: /tmp/outputs/decyzja, default: "andon"}
      container:
        image: fabryka-toolbox:lekcja
        imagePullPolicy: IfNotPresent
        command: [bash, -eo, pipefail, -c]
        args: ["mkdir -p /tmp/outputs; t0=$(date +%s%N); trap 'python3 sdlc/slad.py krok --start $t0 --exit $? 2>/dev/null || true' EXIT; {{inputs.parameters.skrypt}}"]
        workingDir: /work/repo
        env:
          - {name: ZLECENIE, value: "{{inputs.parameters.zlecenie}}"}
          - {name: AGENT, value: "{{inputs.parameters.agent}}"}
          - {name: ATTEMPT, value: "{{inputs.parameters.proba}}"}
          - {name: FABRYKA_RUN, value: "{{workflow.name}}"}
          - name: FABRYKA_NODE
            valueFrom: {fieldRef: {fieldPath: "metadata.annotations['workflows.argoproj.io/node-name']"}}
          - {name: OUT, value: "/work/out/{{inputs.parameters.zlecenie}}/proba-{{inputs.parameters.proba}}"}
          - {name: OUTPUTS_DIR, value: /tmp/outputs}
          - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        volumeMounts: [{name: work, mountPath: /work}]

    # Każdy krok to ten sam obraz i ten sam dysk. Różni się tylko skrypt. Krok, który buduje i testuje kod agenta,
    # nie ma żadnego sekretu: klucz cosign widzi tylko księga (krok-podpis), token GitHuba tylko krok-github.
    - name: krok
      inputs:
        parameters: [{name: skrypt}, {name: zlecenie}, {name: agent, value: kagent}, {name: proba, value: "1"}]
      container:
        image: fabryka-toolbox:lekcja
        imagePullPolicy: IfNotPresent
        command: [bash, -eo, pipefail, -c]
        args: ["t0=$(date +%s%N); trap 'python3 sdlc/slad.py krok --start $t0 --exit $? 2>/dev/null || true' EXIT; {{inputs.parameters.skrypt}}"]
        workingDir: /work/repo
        env:
          - {name: ZLECENIE, value: "{{inputs.parameters.zlecenie}}"}
          - {name: AGENT, value: "{{inputs.parameters.agent}}"}
          - {name: ATTEMPT, value: "{{inputs.parameters.proba}}"}
          - {name: FABRYKA_RUN, value: "{{workflow.name}}"}
          - name: FABRYKA_NODE
            valueFrom: {fieldRef: {fieldPath: "metadata.annotations['workflows.argoproj.io/node-name']"}}
          - {name: FABRYKA_STEP, value: "{{pod.name}}"}
          - {name: OUT, value: "/work/out/{{inputs.parameters.zlecenie}}/proba-{{inputs.parameters.proba}}"}
          - {name: OUTPUTS_DIR, value: /tmp/outputs}
          - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          - {name: KAGENT_URL, value: "http://kagent-controller.kagent.svc:8083"}
          - {name: KAGENT_NS, value: fabryka}
          - {name: A2A_USER, value: "linia@fabryka"}
        volumeMounts: [{name: work, mountPath: /work}]
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {memory: 2Gi}

    # Księga: jedyny krok z kluczem fabryki. Nie uruchamia kodu agenta, tylko sdlc/ i git.
    - name: krok-podpis
      inputs:
        parameters: [{name: skrypt}, {name: zlecenie}, {name: agent, value: kagent}, {name: proba, value: "1"}]
      container:
        image: fabryka-toolbox:lekcja
        imagePullPolicy: IfNotPresent
        command: [bash, -eo, pipefail, -c]
        args: ["t0=$(date +%s%N); trap 'python3 sdlc/slad.py krok --start $t0 --exit $? 2>/dev/null || true' EXIT; {{inputs.parameters.skrypt}}"]
        workingDir: /work/repo
        env:
          - {name: ZLECENIE, value: "{{inputs.parameters.zlecenie}}"}
          - {name: AGENT, value: "{{inputs.parameters.agent}}"}
          - {name: ATTEMPT, value: "{{inputs.parameters.proba}}"}
          - {name: FABRYKA_RUN, value: "{{workflow.name}}"}
          - name: FABRYKA_NODE
            valueFrom: {fieldRef: {fieldPath: "metadata.annotations['workflows.argoproj.io/node-name']"}}
          - {name: FABRYKA_STEP, value: "{{pod.name}}"}
          - {name: OUT, value: "/work/out/{{inputs.parameters.zlecenie}}/proba-{{inputs.parameters.proba}}"}
          - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        volumeMounts: [{name: work, mountPath: /work}, {name: cosign, mountPath: /run/secrets/cosign, readOnly: true}]

    # Finał: jedyne kroki z tokenem GitHuba (Secret fabryka-github z make github). Nie budują kodu agenta:
    # fetch, commit księgi, push gałęzi, PR i komentarze. Git bez hooków, token w nagłówku (sdlc/github.py).
    - name: krok-github
      inputs:
        parameters: [{name: skrypt}, {name: zlecenie}, {name: agent, value: kagent}, {name: proba, value: "1"}]
      container:
        image: fabryka-toolbox:lekcja
        imagePullPolicy: IfNotPresent
        command: [bash, -eo, pipefail, -c]
        args: ["t0=$(date +%s%N); trap 'python3 sdlc/slad.py krok --start $t0 --exit $? 2>/dev/null || true' EXIT; {{inputs.parameters.skrypt}}"]
        workingDir: /work/repo
        env:
          - {name: ZLECENIE, value: "{{inputs.parameters.zlecenie}}"}
          - {name: AGENT, value: "{{inputs.parameters.agent}}"}
          - {name: ATTEMPT, value: "{{inputs.parameters.proba}}"}
          - {name: FABRYKA_RUN, value: "{{workflow.name}}"}
          - name: FABRYKA_NODE
            valueFrom: {fieldRef: {fieldPath: "metadata.annotations['workflows.argoproj.io/node-name']"}}
          - {name: OUT, value: "/work/out/{{inputs.parameters.zlecenie}}/proba-{{inputs.parameters.proba}}"}
          - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          - name: GH_TOKEN
            valueFrom: {secretKeyRef: {name: fabryka-github, key: GH_TOKEN, optional: true}}
          - name: GH_REPO
            valueFrom: {secretKeyRef: {name: fabryka-github, key: GH_REPO, optional: true}}
        volumeMounts: [{name: work, mountPath: /work}]

    # Finał: wynik linii na GitHubie. lights-out i człowiek dostają PR (gałąź agenta + commit z księgą),
    # andon dostaje komentarz pod issue. Księga jedzie z kodem: job `pochodzenie` w Actions sprawdza ją przed merge.
    - name: github
      inputs:
        parameters: [{name: zlecenie}, {name: proba}, {name: decyzja}]
      steps:
        - - name: run
            template: krok-github
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    decyzja="{{inputs.parameters.decyzja}}"; issue="${ZLECENIE#issue-}"
                    if [ "$decyzja" = "andon" ]; then
                      [ -s "$OUT/andon.md" ] || echo "Linia stanęła bez przejścia kontroli jakości." > "$OUT/andon.md"
                      python3 sdlc/github.py andon --issue "$issue" --file "$OUT/andon.md"; exit 0
                    fi
                    mkdir -p ".fabryka/$ZLECENIE"
                    for f in ledger.jsonl ledger.sigstore.json karta.md; do [ ! -f "$OUT/$f" ] || cp "$OUT/$f" ".fabryka/$ZLECENIE/"; done
                    git add .fabryka && git -c core.hooksPath=/dev/null commit -qm "fabryka: księga zlecenia $ZLECENIE (próba $ATTEMPT, $decyzja)"
                    python3 sdlc/github.py git push -q --force "{remote}" "agent/$ZLECENIE"
                    python3 sdlc/github.py pr --issue "$issue" --out "$OUT" --decision "$decyzja"

    # Po każdym przebiegu (onExit): korzeń śladu zlecenia, a na GitHubie andon pod issue, jeśli przebieg padł bez decyzji.
    - name: koniec
      steps:
        - - name: slad
            template: krok
            arguments:
              parameters:
                - {name: zlecenie, value: "{{workflow.parameters.zlecenie}}"}
                - name: skrypt
                  value: python3 sdlc/slad.py korzen --start "{{workflow.creationTimestamp}}" --status "{{workflow.status}}" || true
          - name: github
            template: krok-github
            when: "{{workflow.parameters.zrodlo}} == github"
            arguments:
              parameters:
                - {name: zlecenie, value: "{{workflow.parameters.zlecenie}}"}
                - name: skrypt
                  value: python3 sdlc/github.py koniec --issue "${ZLECENIE#issue-}" --status "{{workflow.status}}" || true

    - name: przygotuj
      inputs:
        parameters: [{name: zlecenie}, {name: proba}, {name: zrodlo, value: plik}]
      steps:
        # Finał: repo z GitHuba (main tam jest prawdą, także dla wyroczni) i zlecenie z issue. Token ma tylko ten krok.
        - - name: github
            template: krok-github
            when: "{{inputs.parameters.zrodlo}} == github"
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    mkdir -p "$OUT"
                    if [ "$ATTEMPT" = "1" ]; then
                      auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
                      [ -d .git ] || git init -q .
                      git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" -c core.hooksPath=/dev/null \
                        fetch -q "https://github.com/$GH_REPO.git" main
                      git -c core.hooksPath=/dev/null checkout -q -f -B main FETCH_HEAD && git clean -qfdx -e .sdlc
                      echo "main z github.com/$GH_REPO: $(git log --oneline -1)"
                    fi
                    python3 sdlc/github.py zlecenie --issue "${ZLECENIE#issue-}" > "$OUT/zlecenie.json"
                    echo "issue #${ZLECENIE#issue-}: $(jq -r .title "$OUT/zlecenie.json") ($(jq -r .url "$OUT/zlecenie.json"))"
        - - name: run
            template: krok
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    # Gałąź zlecenia na kopii repo. Próba 1 zaczyna od main, poprawka kontynuuje gałąź.
                    git config user.name "agent[bot]"; git config user.email "agent@fabryka"
                    if [ "$ATTEMPT" = "1" ]; then git checkout -q main && git switch -q -C "agent/$ZLECENIE"; else git checkout -q "agent/$ZLECENIE"; fi
                    rm -rf .sdlc && mkdir -p .sdlc "$OUT" && : > /work/events.jsonl
                    if [ "$ATTEMPT" != "1" ]; then cp "/work/out/$ZLECENIE/proba-$((ATTEMPT - 1))/feedback.md" .sdlc/feedback.md && echo "raport z próby $((ATTEMPT - 1)) dołączony"; fi
                    if [ -f "$OUT/zlecenie.json" ]; then cp "$OUT/zlecenie.json" .sdlc/zlecenie.json; else python3 sdlc/zlecenia.py "$ZLECENIE" > .sdlc/zlecenie.json; fi
                    echo "zlecenie: $(jq -r .title .sdlc/zlecenie.json) (próba $ATTEMPT, gałąź $(git branch --show-current))"

    - name: przyjecie
      inputs:
        parameters: [{name: zlecenie}, {name: proba}, {name: zrodlo, value: plik}]
      outputs:
        parameters:
          - name: accepted
            valueFrom: {parameter: "{{steps.run.outputs.parameters.accepted}}"}
      steps:
        - - name: run
            template: krok-z-wyjsciem
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    title=$(jq -r .title .sdlc/zlecenie.json); body=$(jq -r .body .sdlc/zlecenie.json)
                    python3 sdlc/context.py route --title "$title" --body "$body" --out-md .sdlc/route.md
                    python3 sdlc/intake.py --title "$title" --body "$body" --out-md .sdlc/intake.md
                    cp .sdlc/intake.md .sdlc/route.md "$OUT/"
                    if [ "$(cat /tmp/outputs/accepted)" != "true" ]; then echo "Zlecenie odesłane do autora: $OUT/intake.md"; fi
        # Finał: pytania agenta `przyjecie` lądują pod issue, tam gdzie jest autor.
        - - name: odeslij
            template: krok-github
            when: "{{inputs.parameters.zrodlo}} == github && {{steps.run.outputs.parameters.accepted}} != true"
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: python3 sdlc/github.py odeslij --issue "${ZLECENIE#issue-}" --file "$OUT/intake.md"

    - name: wykonawca
      inputs:
        parameters: [{name: zlecenie}, {name: agent}, {name: proba}, {name: modul, value: ""}]
      steps:
        - - name: run
            template: krok
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: agent, value: "{{inputs.parameters.agent}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    title=$(jq -r .title .sdlc/zlecenie.json); body=$(jq -r .body .sdlc/zlecenie.json)
                    python3 sdlc/agent.py prompt --title "$title" --body "$body" > /dev/null
                    REPLAY_MODULE="{{inputs.parameters.modul}}" python3 sdlc/agent.py run
                    python3 sdlc/slad.py narzedzia --events /work/events.jsonl || true
                    # Wyrocznia: czy agent próbował zajrzeć do scenariuszy? Serwer odrzuca odczyt, ale próbę zapisuje.
                    if grep -q holdout.peek /work/events.jsonl 2>/dev/null; then echo "::uwaga:: agent zaglądał do scenarios/ (holdout.peek), zapisane"; grep holdout.peek /work/events.jsonl > "$OUT/holdout-peek.jsonl"; fi
                    # Agent nie może dotykać bramek ani wyroczni. Serwer to odrzuca, a tu sprawdzamy jeszcze raz.
                    touched=$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -vE '^\.sdlc/|__pycache__' || true)
                    echo "$touched"
                    if echo "$touched" | grep -qE '^(sdlc/|platforma/|system/architecture/|scenarios/|\.github/|\.fabryka/)'; then echo "::błąd:: agent zmienił bramki, wyrocznię albo workflowy"; exit 1; fi
                    if [ -z "$touched" ]; then echo "::błąd:: agent nic nie zmienił"; exit 1; fi

    - name: zmiana
      inputs:
        parameters: [{name: zlecenie}, {name: agent}, {name: proba}]
      steps:
        - - name: run
            template: krok
            arguments:
              parameters:
                - {name: zlecenie, value: "{{inputs.parameters.zlecenie}}"}
                - {name: agent, value: "{{inputs.parameters.agent}}"}
                - {name: proba, value: "{{inputs.parameters.proba}}"}
                - name: skrypt
                  value: |
                    title=$(jq -r .title .sdlc/zlecenie.json)
                    git add -A system docs && git commit -q -m "agent($AGENT): $title (próba $ATTEMPT)"
                    git format-patch -q main --stdout > "$OUT/zmiana.patch"
                    cp .sdlc/pr-body.md "$OUT/opis.md" 2>/dev/null || echo "Zmiana wygenerowana przez agenta." > "$OUT/opis.md"
                    cp .sdlc/agent-events.jsonl "$OUT/" 2>/dev/null || true; cp /work/events.jsonl "$OUT/narzedzia.jsonl" 2>/dev/null || true
                    echo "Zmiana na gałęzi agent/$ZLECENIE: $(git rev-parse --short HEAD). Łatka: $OUT/zmiana.patch"; git show --stat HEAD | tail -n +5

    # Wariant kroku z wyjściem `accepted` (Argo czyta plik).
    - name: krok-z-wyjsciem
      inputs:
        parameters: [{name: skrypt}, {name: zlecenie}, {name: agent, value: kagent}, {name: proba, value: "1"}]
      outputs:
        parameters:
          - name: accepted
            valueFrom: {path: /tmp/outputs/accepted, default: "false"}
      container:
        image: fabryka-toolbox:lekcja
        imagePullPolicy: IfNotPresent
        command: [bash, -eo, pipefail, -c]
        args: ["mkdir -p /tmp/outputs; t0=$(date +%s%N); trap 'python3 sdlc/slad.py krok --start $t0 --exit $? 2>/dev/null || true' EXIT; {{inputs.parameters.skrypt}}"]
        workingDir: /work/repo
        env:
          - {name: ZLECENIE, value: "{{inputs.parameters.zlecenie}}"}
          - {name: AGENT, value: "{{inputs.parameters.agent}}"}
          - {name: ATTEMPT, value: "{{inputs.parameters.proba}}"}
          - {name: FABRYKA_RUN, value: "{{workflow.name}}"}
          - name: FABRYKA_NODE
            valueFrom: {fieldRef: {fieldPath: "metadata.annotations['workflows.argoproj.io/node-name']"}}
          - {name: OUT, value: "/work/out/{{inputs.parameters.zlecenie}}/proba-{{inputs.parameters.proba}}"}
          - {name: OUTPUTS_DIR, value: /tmp/outputs}
          - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          - {name: KAGENT_URL, value: "http://kagent-controller.kagent.svc:8083"}
          - {name: KAGENT_NS, value: fabryka}
          - {name: A2A_USER, value: "linia@fabryka"}
        volumeMounts: [{name: work, mountPath: /work}]
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {memory: 2Gi}
